name: Publish projections

# Builds the page on GitHub's machines every half hour, with nothing running on anybody's
# laptop, and commits the finished page straight back to this branch -- which is the branch
# GitHub Pages serves. The page has to live next to the code rather than on a branch of its
# own, because a scheduled workflow only ever runs from the repository's default branch.
#
# The ledgers are the models' memory: every pick they have ever made, frozen at kickoff.
# They are committed back too, so the next run picks up where this one left off.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # A scheduled run checks out the branch as it stood when the schedule fired, which can
      # be a commit or two behind by the time a runner actually picks it up. The ledgers are
      # the models' memory, so building from a stale copy would quietly throw away the last
      # run's grading -- and the push at the end would be rejected as out of date.
      - name: Start from the current tip
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --hard "origin/$GITHUB_REF_NAME"
          git log --oneline -1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::httr
            any::jsonlite
            any::dplyr
            any::tidyr
            any::purrr
            any::lubridate
            any::DT
            any::nflreadr
            any::Matrix
            any::nanoparquet

      # Several hundred megabytes of league data and API responses: thirteen seasons of
      # play-by-play and every box score the models have ever read. Restoring it is the
      # difference between a ten minute run and an all-afternoon one. Saving is a separate
      # step on purpose, so a run that fails or runs out of time still banks whatever it
      # managed to fetch and the next run starts from there. The key turns over every six
      # hours, which is often enough to keep up and rare enough not to fill the cache.
      - name: Name the cache
        id: ck
        run: echo "key=projdata-$(date -u +%Y%m%d)-$(( $(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - name: Restore the data caches
        uses: actions/cache/restore@v4
        with:
          path: |
            nfl_cache
            proj_cache
          key: ${{ steps.ck.outputs.key }}
          restore-keys: projdata-

      # Hand last run's page to the builder. Days that are settled and already built are
      # kept as they are, so each run only recomputes what actually moved.
      - name: Seed the previous page
        run: |
          mkdir -p _site
          for p in index.html .nojekyll d lib; do
            if [ -e "$p" ]; then cp -R "$p" _site/; fi
          done
          echo "seeded $(find _site -type f | wc -l) file(s) from the last run"

      # The build keeps its own log, committed with the page, so what a run did -- and what
      # it could not reach -- can be read afterwards from the repository itself.
      - name: Build the page
        env:
          SITE_BUILD_ONLY: "1"
          TZ: America/Edmonton
        run: |
          set -o pipefail
          mkdir -p _log
          Rscript -e 'options(site.app_dir = getwd(), site.home = file.path(getwd(), "_site")); source("publish_site.R")' 2>&1 | tee _log/build.txt

      - name: Save the data caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            nfl_cache
            proj_cache
          key: ${{ steps.ck.outputs.key }}

      # Only on a good build: a failed one must not take the live page down with it.
      - name: Move the page into place
        run: |
          rm -rf d lib index.html .nojekyll
          cp -R _site/. .
          rm -rf _site
          touch .nojekyll
          echo "page is $(find d lib index.html -type f 2>/dev/null | wc -l) file(s)"

      # Runs even after a failed build, so whatever the models did learn is not thrown away.
      - name: Commit the page and the ledgers
        if: always()
        run: |
          set -e
          git config user.name  "projections-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="page $(TZ=America/Edmonton date '+%Y-%m-%d %H:%M %Z')"

          # Only the page, the ledgers and the log -- never anything the runner left behind.
          # git add fails outright on a path that does not exist, and after a build that died
          # early some of these will not, so each one is checked first. The csv pattern is
          # handed to git rather than the shell, so a deleted ledger is still noticed.
          stage() {
            local p=()
            for x in index.html .nojekyll d lib nfl_ledger _log; do
              if [ -e "$x" ]; then p+=("$x"); fi
            done
            if compgen -G "*.csv" > /dev/null; then p+=("*.csv"); fi
            if [ ${#p[@]} -gt 0 ]; then git add -A -- "${p[@]}"; fi
          }

          stage
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "$MSG"
          if git push; then exit 0; fi

          # Something else published while this run was building. The page is regenerated
          # whole every time, so rebasing it would only conflict with itself: instead put
          # this run's page and ledgers on top of the new tip and let the newer build win,
          # while keeping any code change that landed in the meantime.
          echo "push rejected -- replaying this run's page on top of the new tip"
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --soft "origin/$GITHUB_REF_NAME"
          git reset -q
          stage
          if git diff --cached --quiet; then echo "nothing left to commit"; exit 0; fi
          git commit -q -m "$MSG"
          git push
